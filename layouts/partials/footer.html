<footer class="site-footer">
  <div class="site-footer__inner shell">
    <p class="site-footer__credit">
      {{ .Params.footer.credit_prefix }}
      <a
        class="site-footer__credit-link"
        href="{{ .Params.footer.credit_url }}"
      >{{ .Params.footer.credit_site }}</a>
    </p>
    <nav class="site-footer__links" aria-label="{{ .Params.a11y.footer_navigation }}">
      <a href="{{ site.Params.githubURL }}">{{ .Params.footer.github_label }}</a>
      <a href="{{ site.Params.releasesURL }}">{{ .Params.footer.releases_label }}</a>
      <span class="site-footer__license">{{ .Params.footer.license_label }}</span>
    </nav>
  </div>
</footer>
