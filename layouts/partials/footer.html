<footer class="site-footer">
  <div class="site-footer__inner shell">
    <div>
      <a class="brand brand--footer" href="{{ site.Home.RelPermalink }}">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3v26M4.74 9.5l22.52 13M4.74 22.5l22.52-13" />
          <circle cx="16" cy="16" r="2.8" />
        </svg>
        <span class="brand__word">entropy</span>
      </a>
      <p>{{ .Params.footer.tagline }}</p>
    </div>
    <div class="site-footer__links">
      <a href="{{ site.Params.githubURL }}">{{ .Params.footer.source_label }}</a>
      <a href="{{ site.Params.releasesURL }}">{{ .Params.footer.releases_label }}</a>
    </div>
    <p class="site-footer__credit">{{ .Params.footer.made_by }}</p>
  </div>
</footer>
