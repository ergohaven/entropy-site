<header class="site-header" data-site-header>
  <div class="site-header__inner shell">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ .Params.a11y.home }}">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 3v26M4.74 9.5l22.52 13M4.74 22.5l22.52-13" />
        <circle cx="16" cy="16" r="2.8" />
      </svg>
      <span class="brand__word">entropy</span>
    </a>

    <button
      class="menu-toggle icon-button"
      type="button"
      aria-expanded="false"
      aria-controls="site-navigation"
      aria-label="{{ .Params.a11y.open_menu }}"
      data-open-label="{{ .Params.a11y.open_menu }}"
      data-close-label="{{ .Params.a11y.close_menu }}"
      data-menu-toggle
    >
      <span></span><span></span>
    </button>

    <nav class="site-nav" id="site-navigation" aria-label="{{ .Params.a11y.primary_navigation }}" data-site-nav>
      <a href="{{ site.Home.RelPermalink }}#features">{{ .Params.nav.features }}</a>
      <a href="{{ site.Home.RelPermalink }}#workflow">{{ .Params.nav.workflow }}</a>
      <a href="{{ site.Home.RelPermalink }}#compatibility">{{ .Params.nav.compatibility }}</a>
      <a href="{{ site.Params.githubURL }}">{{ .Params.nav.github }}</a>
      <a class="site-nav__download" href="{{ site.Home.RelPermalink }}#download">{{ .Params.nav.download }}</a>
    </nav>

    <div class="site-tools">
      <nav class="language-switcher" aria-label="{{ .Params.a11y.language_switcher }}">
        {{ range site.Home.AllTranslations }}
          <a
            href="{{ .RelPermalink }}"
            lang="{{ .Language.Locale }}"
            hreflang="{{ .Language.Locale }}"
            {{ if eq .Language.Lang site.Language.Lang }}aria-current="page"{{ end }}
          >{{ upper .Language.Lang }}</a>
        {{ end }}
      </nav>

      <button
        class="theme-toggle icon-button"
        type="button"
        aria-label="{{ .Params.a11y.theme_to_dark }}"
        data-label-light="{{ .Params.a11y.theme_to_light }}"
        data-label-dark="{{ .Params.a11y.theme_to_dark }}"
        data-theme-toggle
      >
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42" />
        </svg>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z" />
        </svg>
      </button>
    </div>
  </div>
</header>
