<section class="section principles" id="features" aria-labelledby="principles-title">
  <div class="shell">
    <header class="section-heading section-heading--split">
      <div>
        <p class="eyebrow">{{ .Params.eyebrow }}</p>
        <h2 id="principles-title">{{ .Title }}</h2>
      </div>
      <div class="section-heading__body prose">{{ .Content }}</div>
    </header>

    <div class="principles__list">
      {{ range .Params.items }}
        <article class="principle">
          <span class="principle__marker">{{ .marker }}</span>
          <h3>{{ .title }}</h3>
          <p>{{ .text }}</p>
        </article>
      {{ end }}
    </div>
  </div>
</section>
