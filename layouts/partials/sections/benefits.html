<section class="section benefits" id="benefits" aria-labelledby="benefits-title">
  <div class="shell">
    <header class="section-heading section-heading--split">
      <div>
        <p class="eyebrow">{{ .Params.eyebrow }}</p>
        <h2 id="benefits-title">{{ .Title }}</h2>
      </div>
      <div class="section-heading__body prose">{{ .Content }}</div>
    </header>

    <div class="benefits__list">
      {{ range .Params.items }}
        <article class="benefit">
          <span class="benefit__marker">{{ .marker }}</span>
          <h3>{{ .title }}</h3>
          <p>{{ .text }}</p>
        </article>
      {{ end }}
    </div>
  </div>
</section>
