<section class="section capabilities" id="capabilities" aria-labelledby="capabilities-title">
  <div class="shell">
    <header class="section-heading section-heading--split">
      <div>
        <p class="eyebrow">{{ .Params.eyebrow }}</p>
        <h2 id="capabilities-title">{{ .Title }}</h2>
      </div>
      <div class="section-heading__body prose">{{ .Content }}</div>
    </header>

    <div class="capabilities__grid">
      {{ range .Params.categories }}
        <article class="capability">
          <header>
            <h3>{{ .title }}</h3>
            <p>{{ .text }}</p>
          </header>
          <ul>
            {{ range .items }}<li>{{ . }}</li>{{ end }}
          </ul>
        </article>
      {{ end }}
    </div>
  </div>
</section>
