<section class="section compatibility" id="compatibility" aria-labelledby="compatibility-title">
  <div class="shell compatibility__inner">
    <div class="compatibility__copy">
      <h2 id="compatibility-title">{{ .Title }}</h2>
      <div class="prose">{{ .Content }}</div>
      <div class="protocols" aria-label="{{ site.Home.Params.a11y.supported_protocols }}">
        {{ range .Params.protocols }}<span>{{ . }}</span>{{ end }}
      </div>
    </div>

    <div class="device-list">
      {{ range $index, $device := .Params.devices }}
        <div class="device-list__item">
          <span>{{ printf "%02d" (add $index 1) }}</span>
          <strong>{{ $device }}</strong>
          <i aria-hidden="true">↗</i>
        </div>
      {{ end }}
    </div>

    <p class="compatibility__note">{{ .Params.note }}</p>
  </div>
</section>
